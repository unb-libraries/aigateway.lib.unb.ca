
[package]
name = "aigateway_lib_unb_ca"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5.3"
async-trait = "0.1.51"
chrono = { version = "0.4.40", features = ["serde"] }
clap = { version = "4.5.31", features = ["derive"] }
dialoguer = "0.11.0"
env_logger = "0.11.6"
hyper = { version = "0.14.31", features = ["server", "client", "tcp", "http1", "http2"] }
log = "0.4.26"
password-hash = "0.5"
rand = "0.8"
reqwest = "0.12.12"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
tempfile = "3.17.1"
tokio = { version = "1.43.0", features = ["full"] }
uuid = { version = "1.15.1", features = ["v4", "v6"] }
